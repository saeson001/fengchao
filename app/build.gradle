plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 签名配置从 keystore.properties 读取（不入库；口令另存加密保险库）
def ksProps = new Properties()
def ksPropFile = rootProject.file("keystore.properties")
def hasKeystore = ksPropFile.exists()
if (hasKeystore) {
    ksPropFile.withInputStream { ksProps.load(it) }
}

android {
    namespace 'com.saeson.fengchao'
    compileSdk 34

    defaultConfig {
        applicationId "com.saeson.fengchao"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.0.2"
    }

    if (hasKeystore) {
        signingConfigs {
            release {
                storeFile rootProject.file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['storePassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
}
